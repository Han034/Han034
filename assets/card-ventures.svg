<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="100%" height="430" fill="none">
  <defs>
    <radialGradient id="spotlightVentures" cx="50%" cy="0%" r="85%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="borderGradVentures" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <style>
    .mono-tag {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #86868B;
    }
    .h2 {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      fill: #F5F5F7;
    }
    .proj-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      font-weight: 600;
      fill: #F5F5F7;
    }
    .proj-desc {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 400;
      fill: #86868B;
    }
    .tech-pill {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 10.5px;
      font-weight: 500;
      fill: #9CA3AF;
    }
  </style>

  <!-- Card Frame -->
  <rect x="1" y="1" width="838" height="428" rx="20" fill="url(#spotlightVentures)" stroke="url(#borderGradVentures)" stroke-width="1.2"/>

  <!-- Tag Pill -->
  <g transform="translate(32, 26)">
    <rect width="180" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <text x="90" y="14.5" text-anchor="middle" class="mono-tag">// 03 . FEATURED VENTURES</text>
  </g>

  <!-- Section Heading -->
  <text x="32" y="76" class="h2">Selected Deployments &amp; Products</text>

  <!-- Item 1: Fagency -->
  <g transform="translate(32, 98)">
    <rect width="776" height="54" rx="12" fill="#FFFFFF" fill-opacity="0.02" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <text x="20" y="24" class="proj-title">Fagency</text>
    <text x="20" y="42" class="proj-desc">Autonomous Agency OS • Uçtan uca ajans süreçlerini otonomlaştıran yapay zeka operasyon platformu.</text>
    <!-- Right Tech Tags -->
    <g transform="translate(560, 16)">
      <rect x="0" y="0" width="68" height="22" rx="5" fill="#141418" stroke="#26262B"/>
      <text x="34" y="14.5" text-anchor="middle" class="tech-pill">AI Agents</text>
      <rect x="74" y="0" width="46" height="22" rx="5" fill="#141418" stroke="#26262B"/>
      <text x="97" y="14.5" text-anchor="middle" class="tech-pill">n8n</text>
      <rect x="126" y="0" width="62" height="22" rx="5" fill="#141418" stroke="#26262B"/>
      <text x="157" y="14.5" text-anchor="middle" class="tech-pill">Next.js</text>
    </g>
  </g>

  <!-- Item 2: KariyerAI -->
  <g transform="translate(32, 160)">
    <rect width="776" height="54" rx="12" fill="#FFFFFF" fill-opacity="0.02" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <text x="20" y="24" class="proj-title">KariyerAI</text>
    <text x="20" y="42" class="proj-desc">AI Career Intelligence • İş arayanlar için ücretsiz CV analizi ve mülakat optimizasyon platformu.</text>
    <g transform="translate(560, 16)">
      <rect x="0" y="0" width="56" height="22" rx="5" fill="#141418" stroke="#26262B"/>
      <text x="28" y="14.5" text-anchor="middle" class="tech-pill">LLMs</text>
      <rect x="62" y="0" width="58" height="22" rx="5" fill="#141418" stroke="#26262B"/>
      <text x="91" y="14.5" text-anchor="middle" class="tech-pill">React</text>
      <rect x="126" y="0" width="62" height="22" rx="5" fill="#141418" stroke="#26262B"/>
      <text x="157" y="14.5" text-anchor="middle" class="tech-pill">FastAPI</text>
    </g>
  </g>

  <!-- Item 3: VidAI -->
  <g transform="translate(32, 222)">
    <rect width="776" height="54" rx="12" fill="#FFFFFF" fill-opacity="0.02" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <text x="20" y="24" class="proj-title">VidAI</text>
    <text x="20" y="42" class="proj-desc">Automated Video Production • Senaryodan montaja yapay zeka destekli video üretim hattı.</text>
    <g transform="translate(560, 16)">
      <rect x="0" y="0" width="58" height="22" rx="5" fill="#141418" stroke="#26262B"/>
      <text x="29" y="14.5" text-anchor="middle" class="tech-pill">AI/ML</text>
      <rect x="64" y="0" width="56" height="22" rx="5" fill="#141418" stroke="#26262B"/>
      <text x="92" y="14.5" text-anchor="middle" class="tech-pill">Python</text>
      <rect x="126" y="0" width="62" height="22" rx="5" fill="#141418" stroke="#26262B"/>
      <text x="157" y="14.5" text-anchor="middle" class="tech-pill">Azure</text>
    </g>
  </g>

  <!-- Item 4: Screen Pet -->
  <g transform="translate(32, 284)">
    <rect width="776" height="54" rx="12" fill="#FFFFFF" fill-opacity="0.02" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <text x="20" y="24" class="proj-title">Screen Pet</text>
    <text x="20" y="42" class="proj-desc">Spatial Desktop Companion • Kullanıcı ile masaüstünde etkileşime geçen interaktif sanal asistan.</text>
    <g transform="translate(560, 16)">
      <rect x="0" y="0" width="74" height="22" rx="5" fill="#141418" stroke="#26262B"/>
      <text x="37" y="14.5" text-anchor="middle" class="tech-pill">Electron</text>
      <rect x="80" y="0" width="62" height="22" rx="5" fill="#141418" stroke="#26262B"/>
      <text x="111" y="14.5" text-anchor="middle" class="tech-pill">Three.js</text>
      <rect x="148" y="0" width="40" height="22" rx="5" fill="#141418" stroke="#26262B"/>
      <text x="168" y="14.5" text-anchor="middle" class="tech-pill">JS</text>
    </g>
  </g>

  <!-- Item 5: LFG -->
  <g transform="translate(32, 346)">
    <rect width="776" height="54" rx="12" fill="#FFFFFF" fill-opacity="0.02" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <text x="20" y="24" class="proj-title">LFG (Looking For Gamer)</text>
    <text x="20" y="42" class="proj-desc">Gamer Matchmaking Platform • Oyuncuların seviye ve tarzlarına göre takım kurduğu mobil ekosistem.</text>
    <g transform="translate(560, 16)">
      <rect x="0" y="0" width="88" height="22" rx="5" fill="#141418" stroke="#26262B"/>
      <text x="44" y="14.5" text-anchor="middle" class="tech-pill">React Native</text>
      <rect x="94" y="0" width="94" height="22" rx="5" fill="#141418" stroke="#26262B"/>
      <text x="141" y="14.5" text-anchor="middle" class="tech-pill">WebSockets</text>
    </g>
  </g>
</svg>