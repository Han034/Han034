<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" width="100%" height="250" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="spotlight" cx="50%" cy="0%" r="85%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#0F172A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="1"/>
    </radialGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Name Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.5px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: -0.2px;
      fill: #86868B;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.2px;
      fill: #A1A1A6;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      fill: #E5E5EA;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="838" height="248" rx="20" fill="url(#spotlight)" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Status Pill (Top) -->
  <g transform="translate(285, 26)">
    <rect width="270" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>
    <!-- Active Green Indicator -->
    <circle cx="16" cy="13" r="3.5" fill="#30D158"/>
    <circle cx="16" cy="13" r="6" fill="#30D158" fill-opacity="0.2"/>
    <text x="30" y="16.5" class="status-text">AVAILABLE FOR VENTURES &amp; ADVISORY</text>
  </g>

  <!-- Main Name Header -->
  <text x="420" y="105" text-anchor="middle" class="title">Mehmet Emin Becek</text>

  <!-- Subtitle -->
  <text x="420" y="138" text-anchor="middle" class="subtitle">Full-Stack Software Engineer &amp; AI Systems Architect</text>

  <!-- Apple-Style Bottom Attribute Badges -->
  <g transform="translate(145, 178)">
    <!-- Pill 1: Force Studio -->
    <g transform="translate(0, 0)">
      <rect width="180" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>
      <text x="90" y="19" text-anchor="middle" class="pill-text">🚀 Co-Founder @ Force</text>
    </g>

    <!-- Pill 2: Ex-Microsoft -->
    <g transform="translate(192, 0)">
      <rect width="155" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>
      <text x="77.5" y="19" text-anchor="middle" class="pill-text">💼 Ex-Microsoft</text>
    </g>

    <!-- Pill 3: Computer Engineer -->
    <g transform="translate(359, 0)">
      <rect width="190" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>
      <text x="95" y="19" text-anchor="middle" class="pill-text">🎓 Computer Engineer</text>
    </g>
  </g>
</svg>
