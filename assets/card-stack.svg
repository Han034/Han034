<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" height="360" fill="none">
  <defs>
    <radialGradient id="spotlightStack" cx="50%" cy="0%" r="85%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="borderGradStack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <style>
    .mono-tag {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #86868B;
    }
    .h2 {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      fill: #F5F5F7;
    }
    .cat-title {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      fill: #86868B;
      text-transform: uppercase;
    }
    .badge-pill {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 500;
      fill: #F5F5F7;
    }
  </style>

  <!-- Card Frame -->
  <rect x="1" y="1" width="838" height="358" rx="20" fill="url(#spotlightStack)" stroke="url(#borderGradStack)" stroke-width="1.2"/>

  <!-- Tag Pill -->
  <g transform="translate(32, 28)">
    <rect width="180" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <text x="90" y="14.5" text-anchor="middle" class="mono-tag">// 02 . CORE ARCHITECTURE</text>
  </g>

  <!-- Section Heading -->
  <text x="32" y="80" class="h2">Ecosystem &amp; Tech Stack</text>

  <!-- Row 1: Backend & Cloud Infrastructure -->
  <g transform="translate(32, 105)">
    <text x="0" y="14" class="cat-title">Backend &amp; Cloud</text>
    <g transform="translate(160, 0)">
      <!-- Pills -->
      <rect x="0" y="0" width="46" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="23" y="16" text-anchor="middle" class="badge-pill">C#</text>

      <rect x="54" y="0" width="70" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="89" y="16" text-anchor="middle" class="badge-pill">.NET 9</text>

      <rect x="132" y="0" width="105" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="184.5" y="16" text-anchor="middle" class="badge-pill">ASP.NET Core</text>

      <rect x="245" y="0" width="76" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="283" y="16" text-anchor="middle" class="badge-pill">Node.js</text>

      <rect x="329" y="0" width="68" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="363" y="16" text-anchor="middle" class="badge-pill">Python</text>

      <rect x="405" y="0" width="112" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="461" y="16" text-anchor="middle" class="badge-pill">Microsoft Azure</text>

      <rect x="525" y="0" width="68" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="559" y="16" text-anchor="middle" class="badge-pill">Docker</text>
    </g>
  </g>

  <!-- Row 2: Data & Event Streaming -->
  <g transform="translate(32, 165)">
    <text x="0" y="14" class="cat-title">Data &amp; Messaging</text>
    <g transform="translate(160, 0)">
      <rect x="0" y="0" width="94" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="47" y="16" text-anchor="middle" class="badge-pill">PostgreSQL</text>

      <rect x="102" y="0" width="60" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="132" y="16" text-anchor="middle" class="badge-pill">Redis</text>

      <rect x="170" y="0" width="86" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="213" y="16" text-anchor="middle" class="badge-pill">RabbitMQ</text>

      <rect x="264" y="0" width="108" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="318" y="16" text-anchor="middle" class="badge-pill">Apache Kafka</text>

      <rect x="380" y="0" width="106" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="433" y="16" text-anchor="middle" class="badge-pill">Elasticsearch</text>
    </g>
  </g>

  <!-- Row 3: Frontend & Creative 3D -->
  <g transform="translate(32, 225)">
    <text x="0" y="14" class="cat-title">Frontend &amp; 3D</text>
    <g transform="translate(160, 0)">
      <rect x="0" y="0" width="75" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="37.5" y="16" text-anchor="middle" class="badge-pill">React.js</text>

      <rect x="83" y="0" width="72" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="119" y="16" text-anchor="middle" class="badge-pill">Next.js</text>

      <rect x="163" y="0" width="90" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="208" y="16" text-anchor="middle" class="badge-pill">TypeScript</text>

      <rect x="261" y="0" width="94" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="308" y="16" text-anchor="middle" class="badge-pill">TailwindCSS</text>

      <rect x="363" y="0" width="78" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="402" y="16" text-anchor="middle" class="badge-pill">Three.js</text>

      <rect x="449" y="0" width="88" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="493" y="16" text-anchor="middle" class="badge-pill">Babylon.js</text>

      <rect x="545" y="0" width="84" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="587" y="16" text-anchor="middle" class="badge-pill">Electron.js</text>
    </g>
  </g>

  <!-- Row 4: AI & Automation -->
  <g transform="translate(32, 285)">
    <text x="0" y="14" class="cat-title">AI &amp; Automation</text>
    <g transform="translate(160, 0)">
      <rect x="0" y="0" width="144" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="72" y="16" text-anchor="middle" class="badge-pill">Autonomous Agents</text>

      <rect x="152" y="0" width="124" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="214" y="16" text-anchor="middle" class="badge-pill">n8n Automations</text>

      <rect x="284" y="0" width="140" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="354" y="16" text-anchor="middle" class="badge-pill">Azure AI &amp; ML.NET</text>

      <rect x="432" y="0" width="130" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="497" y="16" text-anchor="middle" class="badge-pill">LLM Integrations</text>

      <rect x="570" y="0" width="84" height="24" rx="6" fill="#141418" stroke="#26262B"/>
      <text x="612" y="16" text-anchor="middle" class="badge-pill">CI / CD</text>
    </g>
  </g>
</svg>