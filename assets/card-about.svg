<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" width="100%" height="250" fill="none">
  <defs>
    <radialGradient id="spotlightAbout" cx="50%" cy="0%" r="85%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="borderGradAbout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <style>
    .mono-tag {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #86868B;
    }
    .h2 {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      fill: #F5F5F7;
    }
    .body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 13.5px;
      font-weight: 400;
      line-height: 22px;
      fill: #A1A1A6;
    }
    .pill-tag {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #D1D1D6;
    }
  </style>

  <!-- Card Frame -->
  <rect x="1" y="1" width="838" height="248" rx="20" fill="url(#spotlightAbout)" stroke="url(#borderGradAbout)" stroke-width="1.2"/>

  <!-- Tag Pill -->
  <g transform="translate(32, 28)">
    <rect width="130" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <text x="65" y="14.5" text-anchor="middle" class="mono-tag">// 01 . OVERVIEW</text>
  </g>

  <!-- Section Heading -->
  <text x="32" y="80" class="h2">Systems Engineering &amp; Venture Architecture</text>

  <!-- Paragraph Lines -->
  <text x="32" y="112" class="body">Computer Engineer combining deep full-stack engineering expertise with venture architecture.</text>
  <text x="32" y="134" class="body">Experienced in delivering scalable solutions at <tspan fill="#F5F5F7" font-weight="600">Microsoft</tspan> (.NET, Azure AI, microservices) and fintech platforms at <tspan fill="#F5F5F7" font-weight="600">ParamTech</tspan>.</text>
  <text x="32" y="156" class="body">Currently co-founding <tspan fill="#F5F5F7" font-weight="600">Force Studio</tspan>, building autonomous AI agent workflows and interactive 3D web systems.</text>

  <!-- Bottom Capability Pills -->
  <g transform="translate(32, 192)">
    <g transform="translate(0, 0)">
      <rect width="180" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="90" y="18" text-anchor="middle" class="pill-tag">✦ Autonomous AI Agents</text>
    </g>
    <g transform="translate(190, 0)">
      <rect width="180" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="90" y="18" text-anchor="middle" class="pill-tag">✦ Distributed .NET Systems</text>
    </g>
    <g transform="translate(380, 0)">
      <rect width="165" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="82.5" y="18" text-anchor="middle" class="pill-tag">✦ Spatial &amp; 3D Web</text>
    </g>
    <g transform="translate(555, 0)">
      <rect width="170" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="85" y="18" text-anchor="middle" class="pill-tag">✦ Venture Consulting</text>
    </g>
  </g>
</svg>